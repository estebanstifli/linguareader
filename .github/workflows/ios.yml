# App iOS sin Mac: compila el framework compartido y la app SwiftUI en runners macOS de GitHub (gratis en un
# repositorio público), ejecuta los tests en simulador y deja los .ipa listos para AWS Device Farm (docs/IOS.md).
#
# Dos jobs en paralelo (cada job restaura ~1 GB de caché y GitHub limita el egreso de caché por cuenta, así que no más):
#   ios-device     framework para iPhone (solo esa rebanada) + build sin firma + paquetes para Device Farm (~4 min).
#   ios-simulator  suites de los módulos compartidos y framework para simulador en una sola invocación de Gradle,
#                  luego XCTest y XCTest UI de la app en el simulador.
name: iOS

on:
  push:
    branches: ["**"]
    paths:
      - "core/**"
      - "data/**"
      - "domain/**"
      - "importer/**"
      - "engine/**"
      - "shared/**"
      - "ios/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE: /Applications/Xcode_16.4.app
  XCFRAMEWORK: shared/build/XCFrameworks/debug/LinguaShared.xcframework
  # Sin índice de código (solo lo usa el IDE) y sin firma: menos trabajo por compilación.
  XCODEBUILD_FLAGS: COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

jobs:
  ios-device:
    name: Device Farm packages (iPhone build, unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: sudo xcode-select -s "$XCODE"
      - name: Link LinguaShared for iPhone (arm64)
        run: ./gradlew --console=plain :shared:linkDebugFrameworkIosArm64
      - name: Wrap it as an XCFramework with just that slice
        run: |
          rm -rf "$XCFRAMEWORK"
          xcodebuild -create-xcframework -framework shared/build/bin/iosArm64/debugFramework/LinguaShared.framework -output "$XCFRAMEWORK"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project and install the pods (ML Kit)
        working-directory: ios
        run: xcodegen generate && pod install
      - name: Build for a real device (unsigned; Device Farm re-signs)
        working-directory: ios
        run: >
          set -o pipefail; mkdir -p build;
          xcodebuild build-for-testing
          -workspace LinguaReader.xcworkspace
          -scheme LinguaReader
          -destination "generic/platform=iOS"
          -derivedDataPath build/device
          $XCODEBUILD_FLAGS
          | tee build/xcodebuild-device.log | grep -E "error:|\*\* BUILD|\*\* TEST" || true;
          grep -q "SUCCEEDED" build/xcodebuild-device.log
      - name: Package .ipa files for AWS Device Farm
        working-directory: ios
        run: bash scripts/package-ipa.sh build/device/Build/Products/Debug-iphoneos build/device-farm
      - name: Upload Device Farm packages
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-farm
          path: ios/build/device-farm/*
      - name: Upload the device build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-build-log
          path: ios/build/xcodebuild-device.log
          if-no-files-found: ignore

  ios-simulator:
    name: Shared suites and SwiftUI app tests in the simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: sudo xcode-select -s "$XCODE"
      - name: Shared test suites in the simulator and LinguaShared for the simulator (arm64)
        run: >
          ./gradlew --console=plain
          :core:iosSimulatorArm64Test
          :importer:iosSimulatorArm64Test
          :engine:alignment:iosSimulatorArm64Test
          :engine:supertonic:iosSimulatorArm64Test
          :data:iosSimulatorArm64Test
          :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Upload shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-ios-test-reports
          path: |
            core/build/reports/tests
            importer/build/reports/tests
            engine/*/build/reports/tests
            data/build/reports/tests
          if-no-files-found: ignore
      - name: Wrap the framework as an XCFramework with just that slice
        run: |
          rm -rf "$XCFRAMEWORK"
          xcodebuild -create-xcframework -framework shared/build/bin/iosSimulatorArm64/debugFramework/LinguaShared.framework -output "$XCFRAMEWORK"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project and install the pods (ML Kit)
        working-directory: ios
        run: xcodegen generate && pod install
      - name: Boot an iPhone simulator
        run: |
          mkdir -p ios/build
          bash ios/scripts/prepare-simulator.sh ios/build/sim-udid.txt | tee ios/build/prepare-simulator.log
          echo "SIM_UDID=$(cat ios/build/sim-udid.txt)" >> "$GITHUB_ENV"
      - name: Unit and UI tests in the simulator
        working-directory: ios
        run: >
          set -o pipefail;
          xcodebuild test
          -workspace LinguaReader.xcworkspace
          -scheme LinguaReader
          -destination "platform=iOS Simulator,id=$SIM_UDID"
          -derivedDataPath build/simulator
          -resultBundlePath build/simulator/LinguaReader.xcresult
          $XCODEBUILD_FLAGS
          | tee build/xcodebuild-simulator.log | grep -E "Test Case|error:|warning: unre|\*\* TEST|Executed" || true;
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild-simulator.log
      - name: Collect crash reports and the app log
        if: always()
        run: |
          mkdir -p ios/build/diagnostics
          cp ~/Library/Logs/DiagnosticReports/LinguaReader* ios/build/diagnostics/ 2>/dev/null || true
          xcrun simctl spawn "$SIM_UDID" log show --last 20m --predicate 'process == "LinguaReader"' --style compact > ios/build/diagnostics/app.log 2>/dev/null || true
          for f in ios/build/diagnostics/*.ips; do
            [ -f "$f" ] || continue
            echo "=== $f"
            python3 ios/scripts/crash-summary.py "$f"
          done
          grep -E "Uncaught Kotlin|kotlin\.|Fatal error|Swift runtime failure" ios/build/diagnostics/app.log | head -40 || true
      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            ios/build/xcodebuild-simulator.log
            ios/build/prepare-simulator.log
            ios/build/simulator/LinguaReader.xcresult
            ios/build/diagnostics
          if-no-files-found: ignore
