# Sube la app iOS a TestFlight sin Mac: framework compartido en release, archivo firmado con el certificado de
# distribución y el perfil App Store (secretos del repositorio) y subida con la API de App Store Connect.
# Se lanza a mano (Actions › TestFlight › Run workflow). El número de build es el número de ejecución del workflow,
# así cada subida es mayor que la anterior. Secretos necesarios: docs/IOS.md, sección TestFlight.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión visible (CFBundleShortVersionString), la misma que la ficha de App Store Connect"
        default: "0.4.1"
        required: true

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  XCODE: /Applications/Xcode_16.4.app
  XCFRAMEWORK: shared/build/XCFrameworks/debug/LinguaShared.xcframework
  TEAM_ID: 2FPJ5WXX2G
  PROFILE_NAME: LingoAudioBook App Store

jobs:
  testflight:
    name: Signed archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: sudo xcode-select -s "$XCODE"
      - name: Link LinguaShared for iPhone (arm64, release)
        run: ./gradlew --console=plain :shared:linkReleaseFrameworkIosArm64
      - name: Wrap it as an XCFramework (same path the project expects)
        run: |
          rm -rf "$XCFRAMEWORK"
          xcodebuild -create-xcframework -framework shared/build/bin/iosArm64/releaseFramework/LinguaShared.framework -output "$XCFRAMEWORK"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project and install the pods (ML Kit)
        working-directory: ios
        run: xcodegen generate && pod install
      - name: Install the distribution certificate and the App Store profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          [ -n "$CERT_P12_BASE64" ] && [ -n "$PROFILE_BASE64" ] || { echo "Missing IOS_CERT_P12_BASE64 / IOS_PROFILE_BASE64 secrets"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
          echo "profile $uuid installed"
      - name: Archive (Release, signed)
        working-directory: ios
        run: >
          set -o pipefail; mkdir -p build;
          xcodebuild archive
          -workspace LinguaReader.xcworkspace
          -scheme LinguaReader
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath build/LinguaReader.xcarchive
          -derivedDataPath build/archive
          MARKETING_VERSION="${{ inputs.version }}"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          COMPILER_INDEX_STORE_ENABLE=NO
          | tee build/xcodebuild-archive.log | grep -E "error:|warning: .*sign|\*\* ARCHIVE" || true;
          grep -q "ARCHIVE SUCCEEDED" build/xcodebuild-archive.log
      - name: Export the .ipa for App Store Connect
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/LinguaReader.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export 2>&1 \
            | tee build/xcodebuild-export.log | grep -E "error:|EXPORT" || true
          ls -la build/export
          test -f build/export/LinguaReader.ipa
      - name: Upload to TestFlight (App Store Connect API)
        working-directory: ios
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          [ -n "$ASC_API_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] || { echo "Missing ASC_API_KEY_P8 / ASC_KEY_ID / ASC_ISSUER_ID secrets"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          xcrun altool --validate-app -f build/export/LinguaReader.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f build/export/LinguaReader.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Build ${{ inputs.version }} (${{ github.run_number }}) uploaded; it shows up in TestFlight after Apple processes it (a few minutes)."
      - name: Upload the signed .ipa and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight
          path: |
            ios/build/export/LinguaReader.ipa
            ios/build/xcodebuild-archive.log
            ios/build/xcodebuild-export.log
          if-no-files-found: ignore
