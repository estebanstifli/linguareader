# Proyecto Xcode generado con XcodeGen (`xcodegen generate` en esta carpeta; lo hace CI, ver docs/IOS.md).
# El framework LinguaShared lo produce Gradle: `./gradlew :shared:assembleLinguaSharedDebugXCFramework`.
name: LinguaReader
options:
  bundleIdPrefix: com.linguareader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LinguaReader:
    type: application
    platform: iOS
    sources:
      - path: LinguaReader
    info:
      path: LinguaReader/Info.plist
      properties:
        CFBundleDisplayName: LingoAudioBook
        # Versión y build desde los ajustes de compilación: TestFlight pasa MARKETING_VERSION y CURRENT_PROJECT_VERSION.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, fr, de, it, pt]
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Importar documentos del usuario («Abrir en LingoAudioBook» desde Archivos, Mail, WhatsApp, Safari…): la app
        # recibe una URL con ámbito de seguridad y la copia a su caché (DocumentInbox).
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Book or document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
              - com.adobe.pdf
              - public.plain-text
              - public.html
              - public.rtf
              - net.daringfireball.markdown
              - org.openxmlformats.wordprocessingml.document
              - org.oasis-open.opendocument.text
              - com.lingoaudiobook.fb2
              - com.lingoaudiobook.mobi
              - com.lingoaudiobook.subrip
              - com.lingoaudiobook.webvtt
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.lingoaudiobook.fb2
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [fb2, fbz]
              public.mime-type: [application/x-fictionbook+xml, application/x-fictionbook]
          - UTTypeIdentifier: com.lingoaudiobook.mobi
            UTTypeDescription: Mobipocket book
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, prc, azw, azw3]
              public.mime-type: [application/x-mobipocket-ebook]
          - UTTypeIdentifier: com.lingoaudiobook.subrip
            UTTypeDescription: SubRip subtitles
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [srt]
              public.mime-type: [application/x-subrip]
          - UTTypeIdentifier: com.lingoaudiobook.webvtt
            UTTypeDescription: WebVTT subtitles
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [vtt]
              public.mime-type: [text/vtt]
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/LinguaShared.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        # App ID registrado en el programa de desarrolladores (equivale a com.lingoaudiobook.app en Android).
        PRODUCT_BUNDLE_IDENTIFIER: com.lingoaudiobook.ios
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.4.2"
        CURRENT_PROJECT_VERSION: "6"
        # El compilador emite .stringsdata con las claves de las vistas SwiftUI; CI los vuelca al catálogo.
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        # Solo el archivo de TestFlight se firma (workflow testflight.yml); Debug va sin firma (Device Farm, simulador).
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 2FPJ5WXX2G
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "LingoAudioBook App Store"
  LinguaReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LinguaReaderTests
    dependencies:
      - target: LinguaReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingoaudiobook.ios.tests
  LinguaReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LinguaReaderUITests
    dependencies:
      - target: LinguaReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingoaudiobook.ios.uitests
        TEST_TARGET_NAME: LinguaReader
schemes:
  LinguaReader:
    build:
      targets:
        LinguaReader: all
        LinguaReaderTests: [test]
        LinguaReaderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LinguaReaderTests
        - LinguaReaderUITests
